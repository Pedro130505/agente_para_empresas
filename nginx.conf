# ==============================================================================
# CONFIGURACAO NGINX REVERSE PROXY PARA STREAMLIT COM SUPORTE A WEBSOCKET
# ==============================================================================
# Coloque este arquivo em /etc/nginx/sites-available/dossies.ufmghub.com.br
# e crie o link simbolico em /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name dossies.ufmghub.com.br; # Substitua pelo seu dominio ou IP do servidor

    # Redireciona HTTP para HTTPS (quando o SSL Certbot estiver configurado)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte essencial para WebSockets do Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
